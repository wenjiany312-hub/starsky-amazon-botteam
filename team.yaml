  soul: roles/imageworker/soul.md
  card: roles/imageworker/card.yaml
- id: editor
  name: 质检官
  job: 上架前质检
  soul: roles/editor/soul.md
  card: roles/editor/card.yaml
- id: ads
  name: 广告优化师
  job: 广告投手
  soul: roles/ads/soul.md
  card: roles/ads/card.yaml
- id: reviewer
  name: 复盘分析师
  job: 复盘分析师
  soul: roles/reviewer/soul.md
  card: roles/reviewer/card.yaml
