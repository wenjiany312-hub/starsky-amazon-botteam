product:
  id: starsky-botteam
  name: 星空亚马逊 Bot Team
  version: 1.0.0-rc12
  license_prefix: SKYBT1.
  owner_title: 老板
marketplace: US
fulfillment:
- FBM
- FBA
platforms:
  openbot:
    status: verified
    adapter: adapters/openbot/
  starsky:
    status: todo
    adapter: adapters/starsky/
