- id: scout
  name: 选品侦察员
  job: 选品分析师（美国站 FBA/FBM）
  soul: roles/scout/soul.md
  card: roles/scout/card.yaml
- id: guard
  name: 风控官
  job: 风控官：侵权、合规、账户健康
  soul: roles/guard/soul.md
  card: roles/guard/card.yaml
- id: warehouse
  name: 仓管物流
  job: 货源与仓储（1688、物流、FBA 库存）
  soul: roles/warehouse/soul.md
  card: roles/warehouse/card.yaml
- id: finance
  name: 财务管家
  job: 利润分析师（FBM / FBA 双算）
  soul: roles/finance/soul.md
