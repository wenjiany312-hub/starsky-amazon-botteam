    large_standard_oz: [[4,3.15,3.97,4.23],[8,3.39,4.21,4.47],[12,3.66,4.48,4.74],[16,4.07,4.89,5.15],[20,4.52,5.34,5.60],[24,4.91,5.73,5.99],[28,5.07,5.89,6.15],[32,5.33,6.15,6.41],[36,5.47,6.29,6.55],[40,5.67,6.49,6.75],[44,5.84,6.66,6.92],[48,6.26,7.08,7.34]]

# 未知小费用压力测试假设；不是厂家报价或官方收费上限，实际可能超过。
conditional_fee_bounds:
  source: "cost_defaults.yaml：可替换的预算压力测试假设，非市场费率或实际费用上限"
  upper:
    factory.packaging_cny_per_unit: 3
    factory.labeling_cny_per_unit: 0.5
    factory.domestic_freight_cny_per_shipment: 300
    factory.one_off_cny: 1000
    logistics.other_cny_per_shipment: 200
    amazon.inbound_placement_fee: 1
    amazon.storage_per_cuft_month: 2.4
    amazon.storage_months: 3
