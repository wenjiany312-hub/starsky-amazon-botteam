# s1_cost_model.py 的出厂默认值。全部按 default_assumption 进模型，永远不算“真实成本”。
# 用户自己的费率写在 ~/.starsky/物流配置.yaml（所有产品通用）或 <产品根>/00_产品资料/物流配置.yaml（只管本产品），
# 键与本文件 logistics / amazon / ads 三段相同，只写要覆盖的键即可；用户配置按 user_profile 计入。
schema_version: "1.0"

fx: 7.2                       # 1 站点币 = ? 人民币；有 fx_rate_snapshot.yaml 时以快照为准
target_net_margin: 0.15       # 目标净利率（广告后）
first_batch_qty: 500          # 首批数量：按票分摊报关/国内运费、摊销打样开模检测

logistics:
  customs_mode: "9810"
  customs_fee_cny_per_shipment: 200     # 9810 报关每票约 ¥150–200，取上沿
  domestic_freight_cny_per_shipment: null   # 工厂 → 货代，问厂家
  other_cny_per_shipment: 0             # 英国等站点的额外报关/清关杂费填这里
  first_leg_basis: kg                   # kg=按计费重；cbm=按方
  first_leg_rate_cny: 13                # 美森/快船包税到 FBA 的每 kg 单价（示意，务必换成自己的报价）
  volumetric_divisor: 6000              # 体积重 = 长×宽×高(cm) / 除数
  duty_included: false                  # 默认不包税；只有真实报价或用户认可后才改为 true
  duty_rate: null                       # 不包税时必填：HTS 税率 + 附加关税合计，如 0.25

amazon:
  referral_rate: 0.15
  referral_min: 0.30
  fba_fee: null                         # 有后台收入计算器的真实值就填；空着按下方近似表估
  storage_per_cuft_month: 0.78          # 标准尺寸 1–9 月；10–12 月约 2.40
  storage_months: 2
  inbound_placement_fee: null           # 入库配置费；空着则不计入并提示
  return_loss_rate: 0.03                # 退货/损耗按售价比例

ads:
  cvr_scenarios: [0.08, 0.10, 0.12]     # 没有 SIF/西柚转化数据时的类目默认情景

# 广告前毛利率分档（毛利 = 售价 − 到岸成本 − 亚马逊费用）。只作参考标尺，做不做由用户拍板。
margin_bands:
  - [0.40, "很好（≥40%）"]
  - [0.30, "优秀（30–40%）"]
  - [0.20, "一般（20–30%）"]
  - [0.00, "偏低（<20%）"]
  - [-99, "亏损（广告前已亏）"]

# 官方 2026 美国站非服装、非危险品标准尺寸表；不支持的档位不外推。
# 数字按 Amazon 官方页面索引核验 2026-10-14；后台实际计费仍需复核。
