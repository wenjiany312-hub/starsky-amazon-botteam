  valid_until: "2027-01-14"
  fuel_surcharge_from: "2026-04-17"
  fuel_surcharge_rate: 0.035
  peak_from: "2026-10-15"
  # 每行 [重量上限oz, 售价<10, 售价10-50, 售价>50]，未含附加费。
  non_peak:
    small_standard_oz: [[2,2.43,3.32,3.58],[4,2.49,3.42,3.68],[6,2.56,3.45,3.71],[8,2.66,3.54,3.80],[10,2.77,3.68,3.94],[12,2.82,3.78,4.04],[14,2.92,3.91,4.17],[16,2.95,3.96,4.22]]
    large_standard_oz: [[4,2.91,3.73,3.99],[8,3.13,3.95,4.21],[12,3.38,4.20,4.46],[16,3.78,4.60,4.86],[20,4.22,5.04,5.30],[24,4.60,5.42,5.68],[28,4.75,5.57,5.83],[32,5.00,5.82,6.08],[36,5.10,5.92,6.18],[40,5.28,6.10,6.36],[44,5.44,6.26,6.52],[48,5.85,6.67,6.93]]
