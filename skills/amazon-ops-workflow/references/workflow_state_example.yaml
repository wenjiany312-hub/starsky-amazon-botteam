edition: starsky-v2
release_tag: "2026-08-09"

run:
  run_id: "run_<stable_id>"
  run_mode: production  # production | demo_direct_run
  scenario: A  # A | B | C | D | E
  status: active
  created_at: ""
  updated_at: ""

entry:
