  - {term: WD-40, generic: penetrating lubricant}
  - {term: Windex, generic: glass cleaner, owner: S.C. Johnson}
  - {term: Pop It, generic: fidget popper}
  - {term: Dumpster, generic: roll-off container}

# 适配其他品牌：只能以 "compatible with / for <型号>" 出现在标题或五点的适配说明里；
# 不进 Search Terms、不作广告通投词、不用对方 logo，并加 "not affiliated with" 说明。
compatibility_brands: [iPhone, iPad, AirPods, Apple Watch, MagSafe, Samsung Galaxy, Sonicare, Oral-B, Dyson, Nintendo Switch,
                       PlayStation, Xbox, KitchenAid, Ninja, Keurig, Nespresso, Vitamix, Roomba, Shark, GoPro, Tesla, Stanley,
                       Yeti, Owala, Hydro Flask, Crocs, Kindle]

# 每个产品都要做的检索；做不了的必须写 user_todo 和原因，不能静默跳过。
required_searches:
  - id: uspto_trademark
    title: USPTO 商标检索（核心词、卖点短语、拟用品牌名）
    url: https://tmsearch.uspto.gov/
  - id: design_patent
    title: 外观专利检索（US D 字头）
    url_template: https://patents.google.com/?q=%22{q}%22&country=US&type=DESIGN
  - id: utility_patent
    title: 发明/实用新型专利检索（按功能结构关键词）
    url_template: https://patents.google.com/?q=%22{q}%22&country=US
  - id: image_reverse
    title: 图片反搜（本品主图，看是否某品牌独有外观）
    url: https://lens.google.com/
  - id: schedule_a
    title: Schedule A 批量诉讼排查（品类词 + 头部品牌）
    url_template: https://www.google.com/search?q=%22Schedule+A%22+%22{q}%22+lawsuit
