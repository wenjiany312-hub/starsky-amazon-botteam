billing:
  api_is_not_subscription: true
  checked_at: '2026-10-12'
  api_fast_multiplier: 2
  api_ultrafast_multiplier: 6
  subscription_fast_multiplier: 2.5
  subscription_ultrafast_multiplier: 8
  long_context_input_threshold: 272000
  long_context_input_multiplier: 2
  long_context_output_multiplier: 1.5
  source: https://learn.chatgpt.com/docs/pricing
  note: API价格不换算订阅可用任务数；实际额度依模型、上下文、推理、工具、缓存和返工。
