schema_version: "1.0"
artifact_type: seasonal_calendar
updated: "2026-09-03"
purpose: >
  amazon-seasonal-selection 的全年档期大表（节日 × 场景 × 产品方向）。
  source=course67 为课程《季节选品指南》实录；source=extrapolated 为同构补全，用前必须用去年同月数据验证。
  用法：当前月往后看 2~3 个月 → 去年同月回看 → 偏季品判定 → 交期倒排。⛔ 不用「近期上架」做主筛选（课39）。

usage:
  lookahead_months: [2, 3]
  strong_holiday_lead_months: 7
  verify_with: "卖家精灵「选产品」月份选择器回看去年同月 / Sorftime 类目月度趋势 / 西柚季节性指数"
  off_season_rule: "最优季节品 = 高需求月卖得好 AND 低需求月不掉太多（课63）"

