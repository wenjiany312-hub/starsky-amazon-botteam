schema_version: "2.1"
artifact_type: stage_intake
updated: "2026-10-15"
source: "8·22 使用说明书第一部分：放什么 / 按什么顺序干活 / 跑完拿到什么"
purpose: >
  每次启动一个板块，必须先交互再干活。禁止同一条回复里直接调下游 Skill。
  开口直接给简短选择卡，模型执行策略留在配置中。【等你】=要你拍板（Codex 渲染不出橙色，不要写「橙色=」）。

hard_stops:
  - 用户的任何一句话都先到 starsky-amazon-agent。starsky-fullchain-workflow / amazon-ops-workflow / starsky-singlepoint-intake 不直接响应用户，只由入口调度；它们不出第二张卡、不重复问 A/B/C。
  - 用户只说了「启动星空 / 启动实战 / 从哪开始 / 开始」→ 必须整段打印 `first_choice_card`（含五块介绍），然后停。禁止只问「S1–S5」不解释每块干什么。不要默认全链。
  - 日常运营口令（店铺巡检 / 今日巡检 / 日检 / 周检 / 月检 / FBA 预警 / 断货预警 / 看广告报表 / 广告诊断 / Bulk 报错 / 优化 Listing / 重做主图 等，见入口《日常口令直达》）→ 跳过 first_choice_card 与 A/B/C 卡，默认 B 老运营，同窗直接进对应板块；缺定位物只问一句。
  - 直达同样零叙述：读指针、读模板、静默建夹、探测领星与报表都不打印；第一条回复只能是「该板块首屏结果」或「那一句追问」二选一。⛔ 禁止「我会按…执行」「入口规则把…直达」「我现在读取…」这类过程叙述。
  - 用户说「启动星空全链 / 启动实战全链 / 新品上架速通 / 跑完整链路」→ 整段打印 `full_chain_card`，停；回「开始」后出 S1 的 A/B/C 卡，⛔ 不直接进 00A 访谈。
  - 入口的《版本与授权挂载点》（templates/entry_hooks.yaml）只在「选完板块之后、出轨道卡之前」执行，默认关闭；⛔ 永远不在第一条选择卡之前执行。
  - ⚡ 开卡前零准备：第一条回复禁止读模板、跑脚本、建夹、契约核对，禁止打印「我将启用…/入口规则已确认…/正在读取配置…」这类过程叙述。选择卡已内嵌在 SKILL.md，直接出。建夹与读模板放到用户选完板块之后静默做。
  - 用户回了 S1–S5 或全链 → 先出该板块一句「解决什么」+ `operator_track.yaml` 的 `card`（A 新手 / B 老运营 / C 企业资料），**不要**再把整份三块说明和旧的「资料 1/2/3」打一遍。然后停。
  - "A 新手 + S1 → 立刻整段打印 s1_quick_select.yaml 的 card，然后停。禁止再访谈、禁止先调 MCP。用户回一行站点+售价+模板后，才写 00A 并进入 condition_select。"
  - "B 老运营 → 有定位物就开跑；只有一个 B 则只问一句要 ASIN/报表/Listing。不走新手选品模板。"
  - "C 企业资料 → 要建夹或已有目录；建夹走 init_enterprise_drop.py，停等「已完成」。"
  - 开口卡禁止加戏：不得写 workflow_state.yaml 缺失/未创建、不得体检 00_产品资料 是不是空的、不得展开 MCP 工具名或「Skill 只写报告」。这些等真干活再讲。
  - 开口卡禁止对用户使用内部编号「00C」。对外写「先看你丢进来的资料」。
  - 用户说「要建夹 / 投喂企业资料」→ 在 `00_产品资料/` 生成投喂子夹，列出路径，停等「已完成」。
  - 用户回「已完成」且当前在等投喂 → 先 `--inspect` 扫描投喂夹，再写 00C；空夹要再确认。
  - 「已完成」若当前在等 1688 登录，走 1688 半辅助，不要误当成资料投喂。
  - 新手未回站点+售价+模板、老运营未给定位物、企业资料未「已完成」或未给目录之前，⛔ 不调 MCP、⛔ 不调度专业 Skill。
  - 用户说「启动S2 / 我要启动S2 / 临时切到S2」等：允许同窗切换。立刻出目标板块入口，复用本窗已选 A/B/C。禁止赶去新窗口同时又在本窗出卡。上游没产物则明说按缺数继续。
  - 一个窗口默认只跑当前这一块；用户明确临时切换时可以换块，不要抢跑没点名的板块。
  - 【等你】拍板点（你替不了用户的）必须再停一次，不得用估值假装已经闭环。

reply_after_choice: |
  【星空 · {官方名称}】
  解决什么：{solves}

  接下来整段打印 templates/operator_track.yaml 的 card（A 新手 / B 老运营 / C 企业资料）。
  不要再打印旧的三段分栏说明，不要再问「要建夹/已有目录/没有」。

  我先不干活。

# 第一次「启动星空」、用户还没选定板块：必须整段打印，不得缩成一句代号
first_choice_card: |
  【星空亚马逊 Agent】
  按上架顺序选一块，选完再认 A 新手 / B 老运营 / C 企业资料。

  | 回复 | 官方名称 | 解决什么 |
  |---|---|---|
  | S1 | S1: 选品板块 | 做不做、选款、成本、侵权 |
  | S2 | S2: 文案板块 | 词库、标题、五点、描述 |
  | S3 | S3: 视觉板块 | 主副图、A+、视频，可选品牌故事、旗舰店 |
  | S4 | S4: 广告板块 | 广告架构、诊断、Bulk 待上传 |
  | S5 | S5: 运营板块 | 日常巡检、异常诊断、待审建议 |
  | S6 | S6: 旗舰板块 | AI 广告终端：每日简报、异常整顿、审核后一键推送 |<!--flagship-->
  | 全链 | 从 S1 做到 S5 | 从零做新品，逐块完成 |

  回复：S1–S5 或 全链；也可直接给资料、目录、报表。<!--basic-->
  回复：S1–S6 或 全链；也可直接给资料、目录、报表。<!--flagship-->
  我先不干活。

# 用户说「启动星空全链 / 启动实战全链」：整段打印，不得自己改写板块名（半角冒号 + 空格）
full_chain_card: |
  【星空亚马逊 Agent · 全链】
  从零做新品，逐块完成；需要你拍板时会停。

  | 顺序 | 官方名称 | 这块解决什么 |
  |---|---|---|
  | 1 | S1: 选品板块 | 做不做、选款、成本、侵权 |
  | 2 | S2: 文案板块 | 词库与 Listing |
  | 3 | S3: 视觉板块 | 主副图、A+、视频，可选品牌故事、旗舰店 |
  | 4 | S4: 广告板块 | 广告架构、Bulk 待上传 |
  | 5 | S5: 运营板块 | 巡检、诊断、待审建议 |

  回复：开始，先选 A 新手 / B 老运营 / C 企业资料；或回 S1–S5。
  我先不干活。

# 日常口令直达：命中即跳过两张卡，默认 B 老运营，零叙述；完整表在入口 SKILL.md《日常口令直达》
daily_fast_lane:
  default_track: B
  skip_cards: [first_choice_card, operator_track_card]
  phrases:
    S5: [店铺巡检, 今日巡检, 日检, 每日运营体检, 昨天卖得怎么样, 周检, 广告健康周检, 月检, 经营月复盘, FBA 预警, 断货预警, 库存够不够, 上线后怎么办, 复盘产品广告, 昨天广告不理想, 出第二刀, 广告词埋得够不够, 拉取文案做缺口分析, 热搜词文案补了没]
    S4: [看广告报表, 广告诊断, ACOS 太高, 广告花费异常, 只诊断广告报表, Bulk 报错, 上传失败, 我要搭广告, 新建广告架构, 只跑广告, 广告优化闭环]
    S2: [优化 Listing, 改文案, 老品 Listing 有问题, 只跑词库文案, 老品诊断修复]
    S3: [重做主图, 改图, 做 A+, 做产品视频, 只跑视觉, 做品牌故事, 补品牌故事, 做旗舰店, 旗舰店装修, 店铺装修]
    S1: [重新选个品, 这个品能不能做, 只跑选品, 供应链调研, 我这堆产品哪个能做, 查 IP, 会不会侵权]
  ask_once_if_missing: "缺定位物（报表 / ASIN / 本品图 / 领星配置）时只问一句，不出卡、不连问。"
  no_narration: "读指针 / 模板 / 建夹 / 探测数据源一律静默；第一条回复只能是首屏结果或那一句追问。"
  s5_auto_sources:
    order: [lingxing_config_app_id_non_empty, sp_api_lwa, "ops_workspace/_投喂_巡检报表/**", "S5_运营板块/_投喂_巡检报表/**", manual_numbers_in_chat]  # <!--flagship-->
    order: [lingxing_config_app_id_non_empty, "ops_workspace/_投喂_巡检报表/**", "S5_运营板块/_投喂_巡检报表/**", manual_numbers_in_chat]  # <!--basic-->
    scope_memory: "S5_运营板块/amazon-ops-workflow/ops_state.yaml#patrol_scope"
    ask_text: "进入 S5 先跑接入检查。没有领星 OpenAPI 也没有 SP-API（LWA）时，把报表丢进运营账本或产品夹的 _投喂_巡检报表/ 只能做一次性快照，不能当每天优化。"  # <!--flagship-->
    ask_text: "进入 S5 先跑接入检查。没有接领星时，把报表丢进运营账本或产品夹的 _投喂_巡检报表/ 只能做一次性快照，不能当每天优化。"  # <!--basic-->

# 官方名称不得改口
stages:
  S1:
    name: "S1: 选品板块"
    solves: "做不做、做哪个款、成本撑不撑得住、有没有侵权。"
    feed: |
      至少一个起点：品名/关键词、1688 链接，或走 A 新手快速选品。
      可选：目标价、成本、交期、预算、禁区（电池/液体/认证）。
      厂家报价、规格书、认证放进来，利润才不是估的。
      市场数据和 1688 抓页要事先配好；缺了后面会停，这一步先把资料给我。
    flow: |
      1 先看你丢进来的资料
      2 市场穿透（选了精铺模板 E 时：先调 jingpu-product-selection 出灵感池，【等你】选方向，再穿透验证）
      3 供应商短名单 + 1688 详情
      4 【等你】工厂补充信息回填 + 利润复算——报价含税、起订、交期只有你能问到
      5 IP / 合规
      6 【等你】最终选款——系统给排序和依据，选哪个、押多少货是你的判断
      从零选品很重，确认后再扫市场，不要同一条里直接全域开跑。
    outputs: |
      市场报告、供应商短名单、带真实报价的利润模型、IP 记录、S1 综合 MD/HTML/yaml。
      给 S2 读选款结论；给 S4 读成本结构。
    window_default: "5.6 Terra · 高"
    escalate: "5.6 Sol · 高：IP、能不能做、综合 go/no-go"
    mechanical: "5.6 Luna · 中：YAML 齐了再出 HTML"
    wait_for: "A 新手 / B 老运营 / C 企业资料"
    orange_gates:
      - 工厂回填与利润复算
      - 最终选款

  S2:
    name: "S2: 文案板块"
    solves: "用什么词打、卖点怎么排、页面怎么写。词池歪了，视觉和广告一起歪。"
    feed: |
      至少一个起点：ASIN、现有 Listing、或 S1 的选款结论 / _NEXT_S1到S2.md。
      【等你】SIF / 卖家精灵 / 西柚词表导出——账号在你手上，系统开不了后台。
      合规黑名单有就带上。
      词库活信号要事先配好 SIF；有西柚或卖家精灵也可以。缺了后面会停。
    flow: |
      1 建竞品 ASIN 池
      2 【等你】按来源导出词表放进目录，标清来源和日期
      3 清洗分池（有哪家导哪家，不合并求和）
      4 写九段文案
      5 确认卖点顺序，交给 S3 / S4
    outputs: |
      竞品池、分池词表、keyword_package、九段 Listing、同源 HTML。
      给 S3 读卖点顺序；给 S4 读词池与否定词。
    window_default: "5.6 Terra · 高"
    escalate: "5.6 Sol · 高：Listing 终稿、合规取舍"
    mechanical: "5.6 Luna · 中：词表格式转换、HTML"
    wait_for: "A 新手 / B 老运营 / C 企业资料"
    orange_gates:
      - 词表导出

  S3:
    name: "S3: 视觉板块"
    solves: "图和视频按什么顺序讲这件事。先排信息顺序，再出提示词；成图/成片在站外回填。"
    feed: |
      至少一个起点：本品图/垫图、ASIN、或 S2 文案。
      可选：你认可的竞品图、品牌规范、授权说明。
    flow: |
      1 归档参考图 + 学竞品「第几张讲什么」
      2 垫图分级编号（中途别改名）
      3 按 S2 卖点顺序排信息 + 出提示词（主副图 / A+ / 视频）
      4 【等你】出图前检查，再逐张生成或改图——系统出方案，不称已经出成图
      5 视频分镜与生产包（同一套卖点，不另起说法）
      6 可选：品牌故事、品牌旗舰店（先问现在做 / 以后再做 / 不做；旗舰店要 ≥3 个同系列产品）
    outputs: |
      垫图库、7 图方案、A+ 模块、视频生产包、S3 HTML；选做时另有品牌故事上传包、旗舰店上传包。
      Prompt 就绪 ≠ 已出图。成片回填才算完。
    window_default: "5.6 Sol · 高"
    escalate: "卡住再 5.6 Sol · 极高"
    mechanical: "5.6 Terra · 高 做垫图清单；Luna · 中 只做格式转换"
    wait_for: "A 新手 / B 老运营 / C 企业资料"
    orange_gates:
      - 出图前检查

  S4:
    name: "S4: 广告板块"
    solves: "预算怎么分、结构怎么搭、Bulk 怎么出。不代传、不改后台 Bid。"
    feed: |
      【等你】日预算、目标 ACOS、进攻还是控成本——这不是可以猜的参数。
      真实 SKU/ASIN（演示可缺，但标不可上传）。
      老品：广告报表 + 上一版 ad_plan。
      看竞品广告结构要事先配好 SIF；缺了后面会停。
    flow: |
      1 【等你】确认预算 / 目标 ACOS / 打法姿态
      2 策略 → 架构（按词的角色分组，不按数量平均切）
      3 【等你】审架构 + 确认真实子 SKU，再出首版 Bulk
      4 报表诊断回环（看词的变化，不只看总 ACOS）——分析走 analyzer，禁止直接改 Bulk
    outputs: |
      策略 brief、ad_plan.yaml、架构 HTML、Bulk 候选 + manifest。
      生产模式停在待你上传。SKU 错了表看着正常、一上传全红。
    window_default: "5.6 Terra · 高"
    escalate: "5.6 Sol · 高：策略；Bulk 用 5.6 Luna · 中"
    mechanical: "5.6 Luna · 中：Bulk 编译、校验、Hash"
    wait_for: "预算/ACOS/姿态，或「没有，按缺数继续」（演示不可上传）"
    orange_gates:
      - 预算与姿态
      - 真实 SKU 再出 Bulk

  S5:
    name: "S5: 运营板块"
    solves: "上了架之后做广告优化和文案优化：先看总盘（单量到底哪一端出了问题），再给建议；你审核后才动。文案永远由你到后台手动改。"
    feed: |
      进场先选一条路线（悬浮窗第一项「📘 接入指南」有详细步骤）：
      ① 手动报表：什么都不用接，自己去广告后台「批量操作」下载表格给助手；
      ② 接领星：自动取数，批准后广告改动可一键同步回后台；
      ③ 接赛狐（开发测试中）：先存凭据，数据接入上线前先用手动报表。
      选完做配置检测，配置完成后以后从 S4 进 S5 不再重复配置。
    flow: |
      0 【进场】读 S5_运营板块/s5_route.json：没选路线 → 出进场卡；选过 → 每次一句话确认「沿用上次路线」（检测到已接入领星会问要不要改用自动取数），用户可随时换；没配好的路线先配置检测
      1 取数：手动 = 下载的批量表格放 _投喂_广告报表/；ERP = 按日期自动拉（可选整店 / 当前产品 / ASIN / 父体全部变体）
      2 诊断：先看总盘（单量在哪一端、市场 / 竞争 / 流量核对），再结合本地知识库 + 第三方数据出每条建议的原因和依据
      3 【等你】看优化前后对比报告，认哪些改；文案改稿先过合规硬闸门（S1 IP / 敏感词 / 受限宣称）
      4 落地：ERP 能写的一键同步；手动出上传表你去后台上传；文案你到后台手动改；回执 72 小时看方向、7 天看效果
    outputs: |
      优化前后对比报告（MD + HTML，悬浮窗里点开）、上传表、审批与回执记录。不自动改后台文案。
    window_default: "5.6 Terra · 中或高"
    escalate: "5.6 Sol · 高：要改策略、要动广告结构"
    mechanical: "5.6 Luna · 中：报表字段抽取"
    wait_for: "选好路线并配置完成；手动路线要有下载的批量表格"
    orange_gates:
      - 路线与配置检测
      - 认不认建议
      - 文案合规硬闸门

enterprise_drop:
  trigger:
    - 要建夹
    - 投喂企业资料
    - 接入企业资料
    - 接入我的企业
  script: "<home>/scripts/init_enterprise_drop.py"
  create_command: >
    python "<home>/scripts/init_enterprise_drop.py" --root "<产品run目录>"
  inspect_command: >
    python "<home>/scripts/init_enterprise_drop.py" --root "<产品run目录>" --inspect
  after_create_say: |
    投喂夹已建好（只建空夹和说明，不改你原有文件）：

