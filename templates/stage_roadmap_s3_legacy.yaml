    kb: []
    name: 承接 S2，核对闸门
    skill: starsky-fullchain-workflow
    mcp: []
    model: 6 Luna · 中
    pause: ''
    control:
      id: s3_intake
      model_ref:
      - by_step
      - S3
      - '1'
      - recommended
      allowed_outcomes:
      - complete
      - blocked
      required_artifacts:
      - intake_md
    deferrable: false
    skippable: false
  - n: 2
    kb: []
    name: 本品垫图分类占位（先看完全部 1688/实拍；尺寸图/套杆图必须占位；不自动抓竞品图）
    skill: amazon-listing-image-designer
    mcp: []
    model: 6.1 Sol · 中
    pause: ''
    control:
      id: visual_references
      model_ref:
      - by_step
      - S3
      - '2'
      - recommended
      allowed_outcomes:
      - complete
      - blocked
      required_artifacts:
      - asset_manifest
    deferrable: false
    skippable: false
