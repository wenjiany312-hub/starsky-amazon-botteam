S3:
  name: 视觉板块
  total_steps: 12
  note: 本品转化套图（主副图+A+一次出，不默认识竞品图）→ 人工回填 → 视频必须先让用户选「三段短片 / 一段约10秒 / 先跳过」→ 品牌故事、旗舰店可选（现在做
    / 以后再做 / 不做；以后再做会一直记为待办）。改图在 GPT 网页端 / Codex App 完成，不另设改图步骤。
