   "statement": "Woot（亚马逊旗下，国内经巧豚豚等服务商提报）是\"清货+推排名\"双用通道：库存由 Woot 从 FBA 划走运营，**活动未卖完原路退回省仓储费**；连续 7 天 BD 且价格可全程不变（或 14 天 BD，每轮间隔 7 天、每月最多 21 天）；活动结束购物车、销量、评论、排名自动归还卖家。期间卖家广告不可投，可让 Woot **代投 SP/SD**（方案卖家定、预算预付多还少补，每周二至六返数据、周二至五可提调整）。",
