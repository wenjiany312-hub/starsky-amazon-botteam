   "statement": "选品方向用三渠道同时打分：Amazon（成交侧）、TikTok（社媒种草侧）、Google Trends（搜索趋势侧）。矩阵判读：三路全热=强信号立刻验证供应链；Amazon 热+TikTok 冷=需种草才能起量；TikTok 热+Amazon 冷=早期信号抢先布局；只有 Trends 热=萌芽期提前卡位；三路全冷=暂缓。各渠道有独立阈值（TikTok >1000 条视频、Amazon 月销 10K+、Trends Breakout +5000%）。",
