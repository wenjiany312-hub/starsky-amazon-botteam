   "statement": "老板版北美调研指令（D 级，2026-07）定了四条判读口径：①价格一律用成交价（标价−折扣/coupon 的到手价），标价口径会误导；②价格带按每 $5 一档 × BSR 每 100 名分级，看清头/腰/底部各自聚集在哪个价格带；③广告门槛用「CPC ÷ 价格带集中地入口售价」量化（如 $1÷$20=5%），搜索涨但 CPC 翻倍的细分对中小卖家是陷阱；④流量结构必须拆自然/广告占比，决定能否靠自然排名活下来。",
