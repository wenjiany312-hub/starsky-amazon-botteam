   "statement": "从想法到下单的五阶段闸门清单，每阶段任一项不达标即放弃：①初筛——月搜索>5000、非禁售、无明显侵权、1688 有供应商、预估售价 $15-50；②需求验证——核心词月搜索>1万、Trends 稳定或上升、首页有 <500 评论产品、竞品评分有 3.5-4.5 分；③竞争——首页平均评论<1000、≥2 个 Listing 质量一般、≥1 个可行差异化且成本增加<20%；④利润——毛利率>15%、广告占比<25%、启动资金够撑 3 个月；⑤供应链——≥2 家备选、起订 100-300 件、样品已下单、认证能搞定（B 级培训口径，2026-07-30）。",
   "parameters": {
    "初筛线": {
     "value": 5000,
     "unit": "月搜索量",
     "note": "经验值：初筛月搜索量>5000，预估售价 $15-50，1688 有现成供应商（2026-07-30）"
    },
    "需求线": {
