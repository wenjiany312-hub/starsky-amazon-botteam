   "statement": "竞品推广手段溯源按四层查：①刷单类型（免评单/留评单/空包/明信片，含 WOOT 通道；免评与明信片已重点打击）；②合并类型（Vine 种子国际版仍可用、老连接种子、僵尸合并判据=无父体镜像）；③站外踪迹（Google 搜 FB 群组秒杀/YouTube/TK 推广痕迹）；④广告架构（跑词无规律且词多=自动或大词广泛，成规律=词组或长尾广泛）。叠加异常信号：Day 2 自然爆发、广告停自然涨、月销与流量分严重背离（转化率异常低）=非自然推广嫌疑（D 级，2026-07）。",
