   "statement": "ABA 月度透析的判读口径：在搜索频率排名前 20 万的类目词域内，按**差值**（上月排名-本月排名，正=升）分上升/下降词；用**点击垄断率**与**转化垄断率**双指标读竞争——垄断率高（如 pink curtains 60.4%）=头部锁死，垄断率低（boho 11.4%、cafe 窗帘 17.6%/1.8%）=缝隙机会；**排名骤降的红色警报词必须过 2-3 年趋势二次验证**，排除季节性回落假信号；按 7 维度（颜色/场景/尺寸/风格/功能/材质/加工方式）拆词后交叉组合出机会方向。",
