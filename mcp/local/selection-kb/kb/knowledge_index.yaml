   "statement": "供应侧过闸不看采购价高低，看「允许到岸成本」：售价 − 佣金 − FBA −（CPC÷CVR），按 CVR 三情景 12/15/18% 算出到岸上限带（案例 $19.99 → $3.39/$5.28/$6.53，2026-07-28 经验值）；已闭合口径的「出厂+国际段」必须 ≤ 基准上限 $5.28 才算条件性过闸，压力情景即超的规格先砍，缺 Fee Preview/真实到岸时禁止宣称毛利或可采购（D 级推论）。",
