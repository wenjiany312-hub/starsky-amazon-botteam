   "statement": "把 BSR Top100 样本按「价格带×产品形态」交叉成矩阵，每格看四个数：样本数、月销量、单 ASIN 销量效率（月销÷样本数）、增长代理（格内月销量增长率中位数，截尾 -100%~+500%）。机会格=单 ASIN 效率高 + 增长代理正 + 样本少的低龄训练型结构（案例：仅 3 样本却 1075 月销、单 ASIN 358、增长 +21%）；主流形态的图案升级不是机会，结构升级才是（D 级实跑口径，2026-07-29）。",
   "parameters": {
    "交叉维度": {
     "value": "价格带×形态",
     "unit": "-",
     "note": "口径：价格带按样本分布固定 5 档；形态按标题/参数/卖点规则分类（2026-07-29）"
    },
    "单ASIN效率": {
     "value": "月销÷样本数",
     "unit": "件/ASIN",
     "note": "口径：避免只看样本数量——供给少但单 ASIN 效率高的格子才是机会格"
    },
    "增长代理": {
     "value": "-100%~+500%",
     "unit": "截尾区间",
     "note": "口径：单元格内月销量增长率取中位数并截尾，仅方向判断，不可当真实三个月同比"
    }
   },
