   "statement": "每日选品机会推送是「日常供给型」固定任务：product_scout 单角色全程主责（不套多角色接力），每天从 Amazon/TikTok/Temu/Reddit 四源各扫一遍，产出固定六段简报（机会 Top5-12 / 平台热点 / 季节节日 / 需求信号 / 不建议追 / 一句话），归档 `reports/选品机会/YYYY-MM-DD-*.md`，验收按四件套（路径/3 句摘要/结构化 Top 清单/是否值得今天深挖）；平台抓不到就标注缺口照常交付，全灭则如实标失败，绝不编造（B 级 SOP 原文，2026-06-07/08）。",
   "parameters": {
    "触发节奏": {
     "value": "每日一次",
