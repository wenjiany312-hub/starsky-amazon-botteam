   "statement": "S1（选品可行性研究）阶段的输出不是「做不做」，而是带条件的推进包：决策=GO_WITH_MODIFICATION（条件性推进）+ 三个关键闸门（①旺季最晚下单日是否已过；②普船 58-86 天时效 vs 库存见底日；③上架第 7-14 天补货决策窗）+ 行动边界（不上传、不下单、不改广告，先补样品/材质/包装/交期与真实法律检索）。报告必须附上游数据一致性审计（表行 vs 数据行、唯一 ASIN 引用 vs 完整详情）与「已获取事实/自动推导/缺失及影响」三层窗口（D 级实跑口径，2026-07-26）。",
   "parameters": {
    "阶段决策": {
     "value": "GO_WITH_MODIFICATION",
     "unit": "-",
     "note": "口径：条件性推进=需求成立但事实缺口未补齐；同时锁定「不上传、不下单、不改广告」（2026-07-26）"
    },
    "补货决策窗": {
     "value": "第7-14天",
     "unit": "天",
     "note": "闸门③：上架第 7-14 天做补货决策，首补条件性走快船约 68 天"
    },
    "换汇口径": {
     "value": 1.5,
     "unit": "%缓冲",
     "note": "口径：effective_purchase_rate 含 1.5% 汇率缓冲（案例 6.676，2026-07-27 快照），标条件性非批准预算"
    }
