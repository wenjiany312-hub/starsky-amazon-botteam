   "statement": "抓取被反爬拦截不是任务失败：按固定五级阶梯降级（平台主技能 → Scrapling stealthy/dynamic 降频 → 本机 Chrome 辅助登录 → 公开替代源标注「替代来源」 → 带缺口交付），每份报告必须附「数据采集状态表」（平台/状态/技能/说明），缺该表任务视为未完成；禁止因单平台失败停整份报告，禁止把未抓到写成数据丰富（B 级热修原文，2026-06-08）。",
