     "note": "固定五级，只抓公开页面不绕登录验证码（2026-06-08 热修）"
    },
    "最低交付线": {
     "value": "Amazon 必抓 + 站外三选二",
     "unit": "-",
     "note": "口径：TikTok/Temu/Reddit 至少两个平台有效信号或明确说明失败原因"
