   "statement": "AI 生成/爬虫汇总报告在引用前必须做数值量纲抽检：评论数出现 999,999 / 998,998 / 12,991,299 / 1.26 亿这类堆叠或天文值，或评论值与价格数值同形（$24.99 → 「24.99M 评论」），即为抓取解析污染——该报告的评论壁垒/竞争判断全部作废；成本测算违背「佣金 = 售价 × 15%」等硬比率（如 $20 售价算出 65-70% 毛利且佣金几乎为零）同理重算（D 级反模式，三个报告族同日同型，2026-05-14）。",
   "parameters": {
    "评论可疑带": {
     "value": ">50万",
     "unit": "条",
     "note": "推论：US 站单 ASIN 评论 >50 万高度可疑（头部万级已属极多）；>1000 万直接判污染"
    },
    "形状判据": {
     "value": "堆叠/价格同形",
     "unit": "-",
     "note": "口径：999,999、998,998、24.99M（≈价格×10^6）、12,991,299 等堆叠值 = 解析污染特征"
    },
    "成本交叉律": {
     "value": "佣金=售价×15%",
     "unit": "-",
     "note": "口径：毛利率 >60% 且佣金+FBA 占比 <5% 的测算必错，用 KC-0087 配比重算"
    }
