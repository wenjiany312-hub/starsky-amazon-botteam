   "statement": "低评分法（KC-0077，评分 3-3.8）之外还有镜像机会：高评分成熟市场（案例加权均分 4.75、差评率 1.8%）不等于没切口——把全部差评聚主题，头号差评集中度越高越好（案例头号差评占差评总数 28.6%，直指配件品质短板），用微小成本改该短板即可差异化破局。普遍性用 Helpful 数判（大量 Helpful=普遍痛点），并用跨价位对比区分价格决定的痛点与设计缺陷（案例+培训口径，2026-07）。",
