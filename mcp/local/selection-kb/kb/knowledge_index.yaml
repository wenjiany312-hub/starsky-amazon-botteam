   "statement": "AI 调研产物必须过数据卫生四则：①溯源标注——每个字段标来源（Excel原始/MCP补充/MCP验证一致/推算值/AI推断），确认数据与推断数据不许混排；②Unavailable 不补零——工具不可用时字段保留「Unavailable/待验证」，禁止用 0 或经验值冒充；③差异>30% 人工复核——同字段两源差异超 30% 标异常，两份都保留交人工裁决；④低可用率不出精确数——日期可用率<90% 等低覆盖场景只给区间界（近两年家族下界/上界），不输出精确新品份额（B 级 SKILL + D 级实跑口径，2026-09-17/2026-08）。",
   "parameters": {
    "差异阈值": {
     "value": 30,
     "unit": "%",
     "note": "口径：工具值 vs 表格值差异>30% 标记⚠️ 数据异常，需人工确认（2026-09-17 提取）"
    },
    "日期可用率": {
     "value": 90,
     "unit": "%",
     "note": "口径：已查询子体日期可用率低于 90% 时，报告只给区间界，不输出精确新品份额"
    },
    "调用预算": {
     "value": 80,
     "unit": "次/轮",
     "note": "口径：MCP 复核总量≤80 次/轮，P0 优先（Exact-P1 全量，P1/P2 按配额）"
    }
