# ---- 卡片状态 ----
status: [draft, reviewed, superseded, retracted]

# ---- 引文与时效纪律 ----
rules:
  quote_max_words: 60          # 单条摘录上限（避免镜像原文；官方页面不得整段复制）
  min_sources_for_reviewed: 1   # A 级 1 源即可 reviewed；B/C 级建议 ≥2 源印证后再 reviewed
  freshness_warn_days: 365      # 来源日期超过一年的 mechanism/policy 卡在 index 里标 stale
  thresholds_must_have_source_date: true
