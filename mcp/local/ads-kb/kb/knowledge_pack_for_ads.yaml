   "statement": "ACoS 恒等于 **CPC ÷ (客单价 × 转化率)**；阿波罗体系在这个恒等式上取三组不同输入得到三条基线——**类目平均 ACoS**（市场参照，用建议竞价与类目 CVR）、**产品合理 ACoS**（产品竞争力理论值，用建议竞价与\"出单投放 CVR\"）、**产品实际 ACoS**（账户事实，用实际 CPC 与广告平均 CVR）——三者对比才有诊断意义，单独任一条都不是盈亏线。",
   "authority": "B",
   "confidence": 0.75,
   "parameters": {
    "category_avg_acos": {
     "value": "大词建议竞价 ÷ (类目平均客单价 × 类目平均转化率)",
