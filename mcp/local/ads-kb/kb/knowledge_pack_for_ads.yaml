   "statement": "ACOS 红线随链接年龄阶梯下降：**0-14 天**不控 ACOS（以关键词频次与排名提升为参考）→**15-45 天**以\"毛利+15%\"为上限→**46-90 天**以毛利率为临界点→**90 天后**阶梯降到毛利以下。日常词级处置用六格决策表（默认目标 ACOS 30%）：出单 ≥3 且 CVR 达标且 ACOS 达标→保留+否不相关词；≥3 单 CVR 不达标→降价+否定（exact 除外）；1-3 单 CVR 达标→提价观察；1-3 单 CVR 不达标→暂停点击多无转化词+否定；≥3 单 ACOS 超→降价+否定并观察（继续升就暂停、提取出单词）；1-3 单 ACOS 超→降价+否定（继续过高暂停）。追排名场景另一套：≥10 单 CVR 达标→提价置顶首页；≥10 单 CVR 不达标→降价否定；CVR≥50% →提价加曝光。",
