   "definition": "官方新手路径（**Amazon Ads Academy**，免费，含课程/认证/训练营/视频，可用广告账号同邮箱注册）：按序修 4 门课——①Introduction to Amazon Ads（产品与广告位总览）→ ②Learn the fundamentals of sponsored ads（术语/定向/出价预算/首个活动）→ ③Analyze sponsored ads metrics and reports（指标、报表、销售归因）→ ④Learn strategies to improve sponsored ads performance（定向/出价/预算的提效调整）。**中国卖家另有官方\"亚马逊广告学堂\"微信小程序**（免费，课程+直播+问答社区，每月更新课程目录，官方出品）。"
  },
  {
   "card_id": "KC-0037",
   "term": "CLV（客户终身价值）官方定义：单一客户全关系周期预计总收入；用于决定拉新 vs 留存的投入分配",
   "definition": "**CLV（Customer Lifetime Value，客户终身价值）**官方定义：单一客户在整个品牌关系周期内的**预计总收入**；官方用途：决定**拉新 vs 留存**各投多少——CLV 高（复购型类目）可容忍更高拉新成本，CLV 低（一次性购买类目）拉新出价必须卡紧首单利润。"
  }
 ],
